  This is a verbatim transcription of the single filled path in that EPS, not a
  trace of a raster preview: the EPS stores the artwork as plain PostScript, so
  the moveto/curveto coordinates below are the original Bézier control points.
  The source page transform (`1 -1 scale 0 -199.093 translate`) already maps
  those coordinates into a top-left origin space, i.e. SVG's convention, so they
  are used unchanged.

  The viewBox is the path's exact tight bounding box (Bézier extremes solved
  analytically, not the control-point hull), hence no padding: the mark bleeds to
  all four edges. Add your own margin at the point of use.

  COLOUR: the source specifies CMYK 9.6 / 0 / 95.2 / 0 with no embedded output
  profile, so there is no single correct sRGB value. The fill below is an
  estimate. Replace it if a brand-guide hex exists.
-->
