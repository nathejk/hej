<!--
  App icon, "any" purpose — full-bleed square, dark ground.

  Geometry: the moon (see nathejk-moon.svg for provenance) is scaled to 70% of
  the canvas height and optically centred, leaving 15% margin top and bottom.
  Square and unrounded on purpose: iOS applies its own squircle mask to
  apple-touch-icon and will letterbox anything pre-rounded against a white
  gutter, so corner rounding is left to the platform. See icon-maskable.svg for
  the Android adaptive-launcher variant, which needs different framing.
-->
