<!--
  Notification badge — the small status-bar mark Android shows next to the app
  name (Notification.badge).

  Android discards colour here and keeps only the alpha channel, rendering the
  shape as a flat silhouette tinted by the system. So this must be a solid
  glyph on transparency, not the app icon: passing the icon would yield a filled
  square, since its dark ground is opaque edge to edge.

  The crescent survives this treatment well, which is why it — and not the
  wordmark — is the badge. White fill is conventional and irrelevant to
  rendering (only alpha is read), but keeps the file legible on its own.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Nathejk">
  <g transform="translate(17.39 6) scale(0.55663)">
    <path
      fill="#ffffff"
      d="M77.7764 0.0669
         C41.1167 -0.7261 7.14453 28.3286 1.15137 64.1606
         C-1.65625 81.3906 0.386719 100.059 10.4336 114.661
         C23.6045 134.527 45.5854 148.493 69.5586 150.536
         C77.4131 152.794 68.418 144.161 67.6201 140.566
         C57.4219 122.786 51.9604 102.145 55.2109 81.6689
         C58.3828 55.3599 73.4834 31.126 95.2969 16.3716
         C100.004 12.856 105.065 9.52783 109.965 6.12988
         C99.8701 1.48047 88.8545 -0.390137 77.7764 0.0669
         Z"
    />
  </g>
</svg>
