name: hej

# Dev stack for the Hej Nathejk app. See .agents/skills/docker-dev-stack.
#
# `ui` (Vue) is browser-facing over HTTPS via Traefik; `api` (Go BFF) and `db`
# are internal-only (the api is reached through the Vite dev proxy at /api).
# Full `up` requires the org infra repo's external `traefik` network and local
# DNS for *.local.nathejk.dk.
#
# Real secrets / per-developer overrides go in docker-compose.override.yml
# (gitignored) — never in this file.

services:
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui-dev
    environment:
      CYPRESS_INSTALL_BINARY: "0"
    volumes:
      - ./vue:/app
      - ui-node_modules:/app/node_modules
    networks:
      - local
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # HTTPS via redirect so the SPA runs in a browser secure context
      # (service workers, geolocation, notifications). The redirect middleware
      # is defined locally (repo-scoped) so routing doesn't depend on a
      # middleware defined elsewhere in the shared Traefik config.
      traefik.http.middlewares.hej-redirect-https.redirectscheme.scheme: https
      traefik.http.routers.hej.rule: Host(`hej.local.nathejk.dk`)
      traefik.http.routers.hej.entrypoints: web
      traefik.http.routers.hej.middlewares: hej-redirect-https
      traefik.http.routers.hej.service: hej
      traefik.http.routers.hej-secure.rule: Host(`hej.local.nathejk.dk`)
      traefik.http.routers.hej-secure.entrypoints: websecure
      traefik.http.routers.hej-secure.tls.certresolver: desec
      traefik.http.routers.hej-secure.service: hej
      # Vite's dev port. Required because Traefik can't otherwise infer the
      # port ("port is missing") — both routers bind to this service.
      traefik.http.services.hej.loadbalancer.server.port: "80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      PORT: "4000"
      ENV: development
      WEB_ROOT: ./www
      GOCACHE: /go/.cache/go-build
      # Session cookie signing secret — OVERRIDE in docker-compose.override.yml.
      SESSION_SECRET: dev-insecure-secret-change-me
      SESSION_SECURE: "true"
      # Web Push VAPID keys. Generate a pair (e.g. `npx web-push generate-vapid-keys`
      # or any VAPID generator) and put them here for dev; the PRIVATE key is a
      # secret and belongs in docker-compose.override.yml, never committed.
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      # Dataforsyningen token for the map's WMS base layers (PRD 002). Served to
      # the SPA at runtime via GET /api/config — it lives on the api service, not
      # ui, because it is no longer baked into the bundle. A public quota key
      # rather than a credential, but still not committed: set it in
      # docker-compose.override.yml. Without it the map shows a "missing API key"
      # notice instead of blank tiles.
      DATAFORSYNINGEN_TOKEN: ""
      # MariaDB connection (PRD 008). The db service below has existed since the
      # repo was scaffolded but nothing used it; this is what connects the two.
      # Credentials match the MARIADB_* values on that service. parseTime is
      # required so DATETIME columns scan into time.Time rather than []byte.
      #
      # Same override convention as SESSION_SECRET: the dev value is deliberately
      # boring and lives here, anything real goes in docker-compose.override.yml.
      # An empty or unreachable DSN is non-fatal — the API logs it and runs on
      # mocks (see cmd/api/database.go).
      DB_DSN: "hej:hej@tcp(db:3306)/hej?parseTime=true"
      # NATS JetStream (PRD 008). The broker is a shared, org-level service owned
      # by the `nathejk` repo (nats:2.10-alpine with -js, on the external
      # `jetstream` network). This repo deliberately does NOT run its own: every
      # other consumer (hq, tilmelding, skan) joins the same broker, and a private
      # one here would mean events hej publishes are invisible to hq — silently
      # defeating the whole point of publishing them.
      #
      # Empty or unreachable is non-fatal: reads come from SQL projections, so the
      # API serves in a degraded state rather than not at all (PRD 008 §5).
      JETSTREAM_DSN: "nats://jetstream:4222"
      BLOB_PATH: "/blobs"
      # GO_BUILD_FLAGS: "-race"   # uncomment for the race detector
    volumes:
      - ./go:/app
      - api:/go
      # Sibling checkout of github.com/nathejk/shared-go. The path inside the
      # container matches what go/go.work expects (../../shared-go relative to
      # /app resolves to /shared-go), so edits in that repo are picked up live
      # without a commit/push/version-bump cycle. Prod builds with GOWORK=off and
      # uses the version pinned in go.mod instead.
      - ../shared-go:/shared-go
      # Content-addressed binary objects (portrait bytes, PRDs 003/007). A named
      # volume, not a bind mount: this is the one store that cannot be rebuilt by
      # replaying the event log, so it should not be casually wiped along with a
      # working tree.
      - blobs:/blobs
    networks:
      - local
      - jetstream
    depends_on:
      - db
    labels:
      # Internal-only (reached via the Vite dev proxy); keep it off Traefik.
      # Needed because this Traefik has exposedByDefault=true.
      traefik.enable: "false"

  db:
    image: mariadb:10.8
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: hej
      MARIADB_USER: hej
      MARIADB_PASSWORD: hej
    volumes:
      - db:/var/lib/mysql
    networks:
      - local
    labels:
      traefik.enable: "false"

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    networks:
      - local
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.hej-sql.rule: Host(`sql.hej.local.nathejk.dk`)
    depends_on:
      - db

networks:
  local:
  # External networks are owned by the org infra repo — never redefined here.
  traefik:
    external: true
  # The shared NATS JetStream network, created by the `nathejk` repo's stack.
  # Consumers (hq, tilmelding, skan and now hej) attach to it; nobody else
  # defines the broker.
  jetstream:
    external: true

volumes:
  api:
  db:
  blobs:
  ui-node_modules:
