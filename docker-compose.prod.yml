# Production deployment for Hej Nathejk — plain `docker compose`, NOT Swarm.
#
# Boots the image published by .github/workflows/build-and-publish.yml
# (`nathejk/hej:latest` / `nathejk/hej:<branch>.<run_number>`). The `prod` stage
# is a single container: the Go BFF serves /api/... and falls back to the built
# SPA in /www, so there is no separate `ui` service here — unlike
# docker-compose.yml, where `ui` is a Vite dev server.
#
# WHY NOT SWARM. This file replaces an earlier docker-swarm.yml, which could
# never deploy. `docker stack deploy` only accepts swarm-scoped (overlay)
# networks, but the shared networks on the production host — `traefik` and
# `prod` — are plain bridge networks created by standalone compose stacks, and
# the NATS broker and Traefik themselves run as standalone containers. Hence
# `network "jetstream" is declared as external, but could not be found`.
# Creating overlay replacements would collide by name, and standalone containers
# cannot join a non-`--attachable` overlay, so moving hej to Swarm alone was
# impossible: it would have required migrating the broker, Traefik and every
# sibling stack (nathejk, hq, tilmelding, skan) in one go. Every other service in
# the org deploys with plain compose; hej now does too.
#
# Usage on the production host:
#   # the blob directory is a BIND MOUNT and must exist before the first deploy.
#   # BLOB_DIR has no default on purpose: Docker silently CREATES a missing bind
#   # source, so a typo or a path resolved from the wrong working directory would
#   # start cleanly with an empty portrait directory — indistinguishable from
#   # having lost every portrait. Give it an absolute path.
#   export BLOB_DIR=/path/to/mounts/prod/hej/blobs   # cf. the foto stack's mounts/prod/foto
#   sudo install -d -m 700 -o 1000 -g 1000 "$BLOB_DIR"
#
#   export SESSION_SECRET="$(openssl rand -hex 32)"
#   export DB_PASSWORD="$(openssl rand -hex 24)" DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
#   export VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... DATAFORSYNINGEN_TOKEN=...
#
# Generating the VAPID pair (either way; both verified 2026-08-29):
#
#   docker run --rm node:22-alpine npx -y web-push generate-vapid-keys
#
#   # or with no network, using openssl. Note -w0: basenc wraps at 76 columns by
#   # default, which silently splits the public key and produces an unusable value.
#   openssl ecparam -genkey -name prime256v1 -noout -out vapid.pem
#   openssl ec -in vapid.pem -outform DER | tail -c +8 | head -c 32 |
#     basenc --base64url -w0 | tr -d '='          # private, 43 chars
#   openssl ec -in vapid.pem -pubout -outform DER | tail -c 65 |
#     basenc --base64url -w0 | tr -d '='          # public, 87 chars, starts with B
#
# Generate the pair ONCE and keep it: a push subscription is bound to the public
# key it was created with, so replacing the pair invalidates every subscription
# already handed out. Worse, the client cannot tell — `getSubscription()` still
# returns the old one, so the profile page would report notifications as on while
# nothing could be delivered. Rotating means every member has to re-subscribe.
#   # pin the tag CI produced, don't drift on :latest:
#   HEJ_VERSION=main.42 docker compose -f docker-compose.prod.yml -p prod-hej up -d
#
# Secrets: cmd/api/env.go reads configuration from the environment only — it has
# no SECRETS_DIR / *_FILE support, so Docker secrets under /run/secrets cannot be
# consumed as-is. The values below are therefore interpolated from the deploying
# shell and deliberately have NO defaults: `${VAR:?msg}` makes the deploy fail
# loudly if one is missing. Never commit the values to this file.
#
# STATE (PRD 008, tasks 061/062). This stack is stateful, and the state is
# **host-local**:
#
#   * `db` keeps MariaDB's data directory in a named volume
#   * `hej` keeps portrait bytes in a bind mount at ${BLOB_DIR}
#
# Neither is shared storage, so this stack must always be deployed on the same
# host. That is implicit with compose (there is no scheduler to move it), which
# is one fewer failure mode than the Swarm version's placement constraints —
# but it does mean "deploy hej" means "deploy hej on that host". Portraits are
# the one thing here that cannot be rebuilt from the event log (task 063 backs
# up exactly that directory).
#
# phpMyAdmin is dev-only and must not be added here (task 066).

networks:
  # Owned by the org infra repo — never redefined here. Assumes the shared
  # Traefik reverse proxy is already running on this host.
  traefik:
    external: true
  # The shared network carrying the org's NATS JetStream broker. Also external
  # and also not ours: the broker is one org-level service that every consumer
  # attaches to (task 053). A per-service broker would mean events this service
  # publishes are invisible to hq, which is how PRD 005's check-in goal would
  # fail silently.
  prod:
    external: true
  # Stack-private network for API-to-database traffic. Defined here rather than
  # external because it belongs to this stack and nothing outside it has any
  # business reaching the database.
  local:

volumes:
  # MariaDB's data directory. A local volume, so it lives on whichever host this
  # stack is deployed to.
  #
  # Deliberately NOT in the backup scope: every table in this database is a
  # projection of the event log and rebuilds from it (PRD 008 §8). What must be
  # backed up is the portrait bind mount, which cannot (task 063).
  db-data:

services:
  hej:
    image: nathejk/hej:${HEJ_VERSION:-latest}
    # unless-stopped, not always: an operator who stops this deliberately
    # (mid-incident, say) should not have it come back on the next daemon
    # restart. Replaces the Swarm version's restart_policy.
    restart: unless-stopped
    environment:
      ENV: production
      # PORT (80) and WEB_ROOT (/www) are already baked into the prod image.
      #
      # Session cookies are HMAC-signed and stateless, so they survive
      # restarts. They are NOT, however, the thing that decides whether this
      # service can be replicated — see the note on scaling below.
      # The dev default secret is intentionally insecure — an unset value in
      # production would mean forgeable sessions, hence the hard `:?` failure.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -hex 32}
      # Always behind Traefik TLS here.
      SESSION_SECURE: "true"
      # Web Push. Push is simply unavailable while these are empty, so they are
      # optional — but a missing private key silently disables notifications,
      # which is a core feature of the app, so set them.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Dataforsyningen quota key for the map's WMS base layers, handed to the
      # SPA at runtime via GET /api/config. Deliberately runtime and not a build
      # arg, so the same published image can be deployed with a different key.
      # Empty means the map shows a "missing API key" notice.
      DATAFORSYNINGEN_TOKEN: ${DATAFORSYNINGEN_TOKEN:-}
      # MariaDB (task 061: hej runs its own). Reaches the `db` service below over
      # the stack-private `local` network, so this credential never leaves the
      # stack. multiStatements is required by some shared-go schemas; parseTime
      # keeps DATETIME columns scanning into time.Time. See docker-compose.yml
      # for the longer note on both, including the injection trade-off
      # multiStatements carries.
      DB_DSN: hej:${DB_PASSWORD:?set DB_PASSWORD, e.g. openssl rand -hex 24}@tcp(db:3306)/hej?parseTime=true&multiStatements=true
      # The shared org broker (task 053), reached over the external `prod`
      # network. Same broker the sibling services use, so there is one event log
      # rather than a per-service island. Override JETSTREAM_DSN if the broker
      # answers to a different name on this host than it does in dev.
      #
      # Unreachable is survivable by design: reads come from SQL projections, so
      # a broker outage costs fresh projections and writes, not availability.
      JETSTREAM_DSN: ${JETSTREAM_DSN:-nats://jetstream:4222}
      # Portrait bytes (task 057). A bind mount, so ${BLOB_DIR} must exist on the
      # host before the first deploy — see the header. This is the only state
      # here that cannot be rebuilt from the event log, and therefore the entire
      # backup scope (task 063).
      BLOB_PATH: /blobs
      # Portrait retention (task 109). The rule is settled — an in-race safety
      # feature has no purpose the day after the race — but the *number* is
      # deliberately here rather than in code, because shortening it must not
      # require a deploy. Measured from capture. 0 disables the purge, which is a
      # diagnostic setting, not a supported production one.
      #
      # 30 days is a conservative placeholder awaiting a maintainer's number.
      PORTRAIT_RETENTION: ${PORTRAIT_RETENTION:-720h}
      # How long a phone may keep its cached contacts directory (task 193, PRD 009 §6).
      #
      # The deadline is issued by the server and baked into the payload, because a
      # client-side TTL is defeated by the likeliest thing to be wrong on a phone — its
      # clock — and by anyone who would rather keep other people's numbers. It is also
      # the only lever that reaches a **dormant device**: a phone that never reopens the
      # app after the event, where no purge job, service worker or push will ever run.
      #
      # 14 days, **approved by the maintainer 2026-09-01**. It must stay in step with
      # PORTRAIT_CACHE_MAX_AGE_SECONDS in the frontend (src/config/cache.ts) — the names
      # and the faces expire together on purpose, since a directory with no photos and
      # photos with no names are both worse than neither. Change both or neither. 0
      # disables the deadline, which in production means "keep this forever"; diagnostic
      # only.
      CACHED_DIRECTORY_TTL: ${CACHED_DIRECTORY_TTL:-336h}
      # Retain the uploaded image at full resolution, metadata stripped (task 111),
      # so thumbnail sizes can be regenerated later instead of applying only to
      # portraits taken after a change.
      #
      # **This is the setting that decides how big the backup is.** Renditions are
      # ~15 KB per member; the original adds a few hundred KB — so a full event is of
      # the order of a few hundred MB rather than tens of MB. Set to false if that is
      # not affordable on this host; the app works either way, it just loses the
      # ability to regenerate rendition sizes for portraits already taken.
      #
      # Since task 112 an original is stored **only when it holds more pixels than the
      # 1024px display rendition**, so this cannot silently double the backup with
      # duplicates the way it did on 2026-08-29.
      PORTRAIT_KEEP_ORIGINAL: ${PORTRAIT_KEEP_ORIGINAL:-true}
    volumes:
      # Bind mount rather than a named volume: chosen so the bytes are visible on
      # host for backup (task 063) without going through a container. Absolute
      # path, required: see the header for why there is no default.
      - ${BLOB_DIR:?set BLOB_DIR to the absolute host path holding the portraits}:/blobs
    networks:
      - traefik
      - local
      - prod
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # HTTPS is not optional for this app: service workers, push and
      # geolocation all require a browser secure context. Plain HTTP only ever
      # redirects. Router/service names carry the `prod-` prefix the other
      # production stacks use, to avoid collisions on the shared Traefik.
      traefik.http.middlewares.prod-hej-redirect-https.redirectscheme.scheme: https
      traefik.http.routers.prod-hej.rule: Host(`hej.nathejk.dk`)
      traefik.http.routers.prod-hej.entrypoints: web
      traefik.http.routers.prod-hej.middlewares: prod-hej-redirect-https
      traefik.http.routers.prod-hej.service: prod-hej
      traefik.http.routers.prod-hej-secure.rule: Host(`hej.nathejk.dk`)
      traefik.http.routers.prod-hej-secure.entrypoints: websecure
      traefik.http.routers.prod-hej-secure.tls: "true"
      # Public domain, so ACME/Let's Encrypt — not the `desec` DNS-challenge
      # resolver the dev stack needs for *.local.nathejk.dk. Resolver name must
      # match the one the production Traefik defines (the foto stack uses
      # `letsencrypt`).
      traefik.http.routers.prod-hej-secure.tls.certresolver: letsencrypt
      traefik.http.services.prod-hej.loadbalancer.server.port: "80"
    healthcheck:
      # busybox wget, present on the alpine prod image; no curl to rely on.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # DO NOT `docker compose up --scale hej=2`, and do not add replicas.
    #
    # Original reason (PRD 001): the PIN store (pin.NewStore) and push
    # subscriptions (push.NewMemoryStore) are per-process in-memory maps, so a
    # second instance would round-robin a login between two processes and the PIN
    # issued by one would not verify on the other.
    #
    # Second, stronger reason (task 064, PRD 008 §11 Q1): this service runs
    # projections. Subscriptions in `jrgensen/stream` are ephemeral ordered
    # consumers with **no queue group**, so every process receives every message
    # rather than sharing them out. Two instances would both apply every event to
    # the *same* read model in the *same* database — fine for a strictly
    # idempotent projection, silently wrong for an unconditional `UPDATE`, an
    # insert without a deterministic key, or a read-then-write. The result is a
    # projection that is subtly wrong rather than obviously broken. `hq` reached
    # the same conclusion independently and documents it in its main.go.
    #
    # It applies to the write side too: PRD 005 publishes a verification event,
    # and a read-then-publish command has no compare-and-swap behind it, so two
    # instances can both read the pre-state and both publish.
    #
    # So making the PIN and push stores shared is necessary but NOT sufficient.
    # To replicate later, the clean route is to split the projectors into their
    # own single-instance process, leaving the API stateless and freely
    # replicable. The alternatives — a distinct durable consumer plus a database
    # per instance, or proving every projector and command idempotent under
    # concurrent delivery and continuing to prove it for each new one — are how
    # projections quietly rot.
    #
    # Note that `docker compose up -d` recreates stop-first, which is what this
    # requires: the Swarm version had to ask for `order: stop-first` explicitly to
    # avoid a two-instance window on every deploy. The cost is a few seconds of
    # 502 during a deploy rather than an overlap. For an in-event app that is the
    # better trade, and deploys should not happen mid-event anyway.
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MariaDB (task 061: hej runs its own rather than sharing a managed instance).
  # Mirrors the dev stack's image and database name so "works in dev" means
  # something.
  db:
    image: mariadb:10.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hej
      MARIADB_USER: hej
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, e.g. openssl rand -hex 24}
      # A root password is required by the image even though the API never uses
      # root. Kept distinct from the application password: an application
      # credential leak should not also hand over every other schema on the server.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD, e.g. openssl rand -hex 24}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      # Internal only. No traefik network, no published ports: nothing outside
      # this stack should be able to reach the database, and the dev stack's
      # phpMyAdmin is deliberately not replicated here (task 066).
      - local
    labels:
      traefik.enable: "false"
    healthcheck:
      # mariadb-admin ping succeeds as soon as the server accepts connections,
      # which is what the API's own retrying ping is waiting for.
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
