# Production Swarm deployment for Hej Nathejk.
#
# Boots the image published by .github/workflows/build-and-publish.yml
# (`nathejk/hej:latest` / `nathejk/hej:<branch>.<run_number>`). The `prod` stage
# is a single container: the Go BFF serves /api/... and falls back to the built
# SPA in /www, so there is no separate `ui` service here — unlike
# docker-compose.yml, where `ui` is a Vite dev server.
#
# Usage:
#   # one-time bootstrap on the swarm manager:
#   docker network create --driver overlay traefik    # if not already present
#   docker network create --driver overlay jetstream  # if not already present
#
#   # the blob directory is a BIND MOUNT, so it must exist on the pinned node
#   # (see the placement constraints below) before the first deploy:
#   sudo install -d -m 700 -o 1000 -g 1000 /srv/hej/blobs
#
#   # deploy / upgrade (pin the tag CI produced, don't drift on :latest):
#   export SESSION_SECRET="$(openssl rand -hex 32)"
#   export DB_PASSWORD="$(openssl rand -hex 24)" DB_ROOT_PASSWORD="$(openssl rand -hex 24)"
#   export VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... DATAFORSYNINGEN_TOKEN=...
#   HEJ_VERSION=main.42 docker stack deploy -c docker-swarm.yml hej
#
# Secrets: cmd/api/env.go reads configuration from the environment only — it has
# no SECRETS_DIR / *_FILE support, so Docker secrets under /run/secrets cannot be
# consumed as-is. The values below are therefore interpolated from the deploying
# shell and deliberately have NO defaults: `${VAR:?msg}` makes `stack deploy`
# fail loudly if one is missing. Never commit the values to this file.
#
# STATE (PRD 008, tasks 061/062). This stack is stateful, and the state is
# **node-local**:
#
#   * `db` keeps MariaDB's data directory in a named volume
#   * `hej` keeps portrait bytes in a bind mount at /srv/hej/blobs
#
# Neither is shared storage, so both services are pinned with a placement
# constraint. Swarm will otherwise happily reschedule a task onto another node,
# where it finds an empty volume or an empty directory and carries on as if the data
# had never existed — a projection would silently rebuild from the log, which looks
# like recovery, while every portrait would be gone for good. Portraits are the one
# thing here that cannot be rebuilt (task 063 backs up exactly that directory).
#
# If this ever needs to survive losing a node, that is a move to real shared or
# replicated storage, not a bigger replica count — see the note on `deploy.replicas`.
#
# phpMyAdmin is dev-only and must not be added here (task 066).

version: "3.8"

services:
  hej:
    image: nathejk/hej:${HEJ_VERSION:-latest}
    environment:
      ENV: production
      # PORT (80) and WEB_ROOT (/www) are already baked into the prod image.
      #
      # Session cookies are HMAC-signed and stateless, so they survive task
      # restarts. They are NOT, however, the thing that decides whether this
      # service can be replicated — see the `deploy.replicas: 1` constraint below.
      # The dev default secret is intentionally insecure — an unset value in
      # production would mean forgeable sessions, hence the hard `:?` failure.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -hex 32}
      # Always behind Traefik TLS here.
      SESSION_SECURE: "true"
      # Web Push. Push is simply unavailable while these are empty, so they are
      # optional — but a missing private key silently disables notifications,
      # which is a core feature of the app, so set them.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Dataforsyningen quota key for the map's WMS base layers, handed to the
      # SPA at runtime via GET /api/config. Deliberately runtime and not a build
      # arg, so the same published image can be deployed with a different key.
      # Empty means the map shows a "missing API key" notice.
      DATAFORSYNINGEN_TOKEN: ${DATAFORSYNINGEN_TOKEN:-}
      # MariaDB (task 061: hej runs its own). Reaches the `db` service below over
      # the internal overlay network, so this credential never leaves the stack.
      # multiStatements is required by some shared-go schemas; parseTime keeps
      # DATETIME columns scanning into time.Time. See docker-compose.yml for the
      # longer note on both, including the injection trade-off multiStatements
      # carries.
      DB_DSN: hej:${DB_PASSWORD:?set DB_PASSWORD, e.g. openssl rand -hex 24}@tcp(db:3306)/hej?parseTime=true&multiStatements=true
      # The shared org broker (task 053), reached over the external `jetstream`
      # overlay network. Same host and port the sibling services use, so there is
      # one broker and one event log rather than a per-service island.
      #
      # Unreachable is survivable by design: reads come from SQL projections, so a
      # broker outage costs fresh projections and writes, not availability.
      JETSTREAM_DSN: ${JETSTREAM_DSN:-nats://jetstream:4222}
      # Portrait bytes (task 057). A bind mount, so this path must exist on the
      # pinned node before the first deploy — see the header. This is the only
      # state here that cannot be rebuilt from the event log, and therefore the
      # entire backup scope (task 063).
      BLOB_PATH: /blobs
    volumes:
      # Bind mount rather than a named volume: chosen so the bytes are visible on
      # the host for backup (task 063) without going through a container. The
      # consequence is that this task is pinned to one node — see the placement
      # constraint below.
      - type: bind
        source: /srv/hej/blobs
        target: /blobs
    networks:
      - traefik
      - internal
      - jetstream
    # Traefik v3 with `providers.docker` reads top-level labels (NOT
    # deploy.labels). If the swarm's Traefik uses `providers.swarm`, move these
    # under deploy.labels instead.
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # HTTPS is not optional for this app: service workers, push and
      # geolocation all require a browser secure context. Plain HTTP only ever
      # redirects. Router/service names are repo-scoped to avoid collisions with
      # other repos on the shared Traefik.
      traefik.http.middlewares.hej-redirect-https.redirectscheme.scheme: https
      traefik.http.routers.hej.rule: Host(`hej.nathejk.dk`)
      traefik.http.routers.hej.entrypoints: web
      traefik.http.routers.hej.middlewares: hej-redirect-https
      traefik.http.routers.hej.service: hej
      traefik.http.routers.hej-secure.rule: Host(`hej.nathejk.dk`)
      traefik.http.routers.hej-secure.entrypoints: websecure
      traefik.http.routers.hej-secure.tls: "true"
      # Public domain, so ACME/Let's Encrypt — not the `desec` DNS-challenge
      # resolver the dev stack needs for *.local.nathejk.dk.
      traefik.http.routers.hej-secure.tls.certresolver: le
      traefik.http.services.hej.loadbalancer.server.port: "80"
    healthcheck:
      # busybox wget, present on the alpine prod image; no curl to rely on.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      # SINGLE REPLICA — do not raise this without reading all of this comment.
      #
      # Original reason (PRD 001): the PIN store (pin.NewStore) and push
      # subscriptions (push.NewMemoryStore) are per-process in-memory maps, so a
      # second replica would round-robin a login between two processes and the PIN
      # issued by task A would not verify on task B.
      #
      # Second, stronger reason (task 064, PRD 008 §11 Q1): this service now runs
      # projections. Subscriptions in `jrgensen/stream` are ephemeral ordered
      # consumers with **no queue group**, so every process receives every message
      # rather than sharing them out. Two replicas would both apply every event to
      # the *same* read model in the *same* database — fine for a strictly
      # idempotent projection, silently wrong for an unconditional `UPDATE`, an
      # insert without a deterministic key, or a read-then-write. The result is a
      # projection that is subtly wrong rather than obviously broken. `hq` reached
      # the same conclusion independently and documents it in its main.go.
      #
      # It applies to the write side too: PRD 005 publishes a verification event,
      # and a read-then-publish command has no compare-and-swap behind it, so two
      # instances can both read the pre-state and both publish.
      #
      # So making the PIN and push stores shared is now necessary but NOT
      # sufficient. To replicate later, the clean route is to split the projectors
      # into their own single-instance process, leaving the API stateless and freely
      # replicable. The alternatives — a distinct durable consumer plus a database
      # per instance, or proving every projector and command idempotent under
      # concurrent delivery and continuing to prove it for each new one — are how
      # projections quietly rot.
      replicas: 1
      placement:
        constraints:
          # Pinned because this task's portrait directory is a node-local bind
          # mount. Without this, Swarm may reschedule onto another node, find an
          # empty /srv/hej/blobs, and serve happily with every portrait gone — the
          # projections would rebuild from the log and hide the fact that anything
          # was lost. Set `hej.storage=true` on the node that holds the data:
          #
          #   docker node update --label-add hej.storage=true <node>
          #
          # A label rather than `node.role == manager` so the data node can be
          # moved without editing this file.
          - node.labels.hej.storage == true
      update_config:
        # stop-first, not start-first: `start-first` boots the new task before
        # stopping the old one, which is exactly the two-instance window the
        # replicas: 1 comment above forbids. It is the right default for a
        # stateless service and the wrong one here — during every deploy both
        # processes would consume the same events and write the same read model.
        #
        # The cost is a brief gap in serving during a deploy instead of an overlap.
        # For an in-event app that is the better trade: a few seconds of 502 is
        # recoverable, a corrupted projection during the race is not. Deploys should
        # not be happening mid-event anyway.
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # MariaDB (task 061: hej runs its own rather than sharing a managed instance).
  # Mirrors the dev stack's image and database name so "works in dev" means
  # something.
  db:
    image: mariadb:10.8
    environment:
      MARIADB_DATABASE: hej
      MARIADB_USER: hej
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, e.g. openssl rand -hex 24}
      # A root password is required by the image even though the API never uses
      # root. Kept distinct from the application password: an application
      # credential leak should not also hand over every other schema on the server.
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD, e.g. openssl rand -hex 24}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      # Internal only. No traefik network, no published ports: nothing outside this
      # stack should be able to reach the database, and the dev stack's phpMyAdmin
      # is deliberately not replicated here (task 066).
      - internal
    labels:
      traefik.enable: "false"
    healthcheck:
      # mariadb-admin ping succeeds as soon as the server accepts connections,
      # which is what the API's own retrying ping is waiting for.
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      # One replica, and it must be one: this is a single MariaDB instance with a
      # node-local volume, not a cluster. Two tasks would mean two divergent
      # databases behind one service name.
      replicas: 1
      placement:
        constraints:
          # Same node as the API's blob directory, and for the same reason: a
          # local volume does not follow a rescheduled task. Rescheduling here is
          # less destructive than for portraits — projections rebuild from the log —
          # but it would still mean an empty database and a full replay at the worst
          # possible moment.
          - node.labels.hej.storage == true
      update_config:
        # stop-first for the same reason as the API, more strictly: two MariaDB
        # tasks briefly sharing one volume risks corruption, not just contention.
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  # Owned by the org infra repo — never redefined here. Assumes a Traefik
  # reverse proxy is already running on this swarm.
  traefik:
    external: true
  # The shared NATS JetStream overlay network. Also external and also not ours: the
  # broker is one org-level service that every consumer attaches to (task 053). A
  # per-service broker would mean events this service publishes are invisible to hq,
  # which is how PRD 005's check-in goal would fail silently.
  jetstream:
    external: true
  # Stack-private overlay for API-to-database traffic. Defined here rather than
  # external because it belongs to this stack and nothing outside it has any business
  # reaching the database.
  internal:
    driver: overlay

volumes:
  # MariaDB's data directory. A local volume, so it lives on whichever node the db
  # task runs on — hence the placement constraint on that service.
  #
  # Deliberately NOT in the backup scope: every table in this database is a
  # projection of the event log and rebuilds from it (PRD 008 §8). What must be
  # backed up is the portrait bind mount, which cannot (task 063).
  db-data:
